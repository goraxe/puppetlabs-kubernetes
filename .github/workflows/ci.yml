name: "ci"

on:
  pull_request:
    branches:
      - "main"
  workflow_dispatch:


jobs:
  Spec:
    uses: "puppetlabs/cat-github-actions/.github/workflows/module_ci.yml@main"
    secrets: "inherit"

  # Manual only (workflow_dispatch). Acceptance scope is reduced to what a
  # hosted runner can do: one privileged systemd container per Debian release,
  # the module applied with a worker role, assertions on packages, containerd,
  # kubelet and the kubeadm join config. No cluster is formed. The three node
  # puppetserver cluster in spec/acceptance/integration_kubernetes_spec.rb
  # (rake kubernetes:integration) still needs real VMs and is not run here.
  Integration:
    if: "github.event_name == 'workflow_dispatch'"
    needs: "Spec"
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        platform: [ 'debian:12', 'debian:13' ]
        collection: [ 'openvox8' ]

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Activate Ruby 3.2
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true

      - name: Print bundle environment
        run: |
          echo ::group::bundler environment
          bundle env
          echo ::endgroup::

      - name: Create the fixtures directory
        run: |
          echo ::group::Create the fixtures directory
          bundle exec rake spec_prep
          echo ::endgroup::

      - name: Build the systemd image
        run: |
          version='${{ matrix.platform }}'
          docker build -t "debian-systemd:${version#*:}" --build-arg "DEBIAN_VERSION=${version#*:}" -f .github/docker/Dockerfile.debian-systemd .github/docker

      - name: Provision test environment
        run: |
          version='${{ matrix.platform }}'
          bundle exec bolt --modulepath spec/fixtures/modules plan run kubernetes::provision_cluster "image_type=debian-systemd:${version#*:}" provision_type=docker 'roles=["controller"]' "inventory=${PWD}/spec/fixtures/litmus_inventory.yaml"
          FILE='spec/fixtures/litmus_inventory.yaml'
          sed -e 's/password: .*/password: "[redacted]"/' < $FILE || true
          echo INVENTORY_PATH=$FILE >> $GITHUB_ENV
          echo TARGET_HOST="$(ruby -ryaml -e 'puts YAML.load_file(ARGV[0])["groups"].flat_map { |g| g["targets"] }.first["uri"]' $FILE)" >> $GITHUB_ENV
          echo CONTAINER="$(docker ps -q | head -n1)" >> $GITHUB_ENV

      - name: Install agent
        run: |
          .github/scripts/install-openvox.sh "$CONTAINER" '${{ matrix.collection }}'

      - name: Install module
        run: |
          .github/scripts/copy-fixtures.sh "$CONTAINER"

      - name: Run smoke acceptance tests
        run: |
          bundle exec rake kubernetes:smoke

      - name: Remove test environment
        if: ${{ always() }}
        continue-on-error: true
        run: |
          bundle exec rake 'litmus:tear_down'
